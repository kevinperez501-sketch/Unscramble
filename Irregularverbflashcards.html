<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Past participle flashcards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f0;--ink:#12302b;--mute:#5d746e;--front:#fffdf8;--back:#12302b;--backink:#f2efe6;--accent:#e0a526;--line:#c9d5d1;--ok:#2f7d5b;--no:#b5472f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a18;--ink:#e6efec;--mute:#8fa8a1;--front:#17302b;--back:#e8c46a;--backink:#14261f;--accent:#e8c46a;--line:#25403a;--ok:#5fc197;--no:#e5836b}}
:root[data-theme="dark"]{--bg:#0d1a18;--ink:#e6efec;--mute:#8fa8a1;--front:#17302b;--back:#e8c46a;--backink:#14261f;--accent:#e8c46a;--line:#25403a;--ok:#5fc197;--no:#e5836b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 18px 32px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-size:1.15rem;margin:0;font-weight:800;letter-spacing:-.01em}
.count{color:var(--mute);font-size:.95rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.scene{perspective:1200px}
.card{position:relative;width:100%;aspect-ratio:4/3;border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit;transform-style:preserve-3d;transition:transform .45s}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:20px;text-align:center}
.f{background:var(--front);border:2px solid var(--ink)}
.b{background:var(--back);color:var(--backink);transform:rotateY(180deg)}
.lab{font-size:.95rem;color:var(--mute)}
.b .lab{color:var(--backink);opacity:.75}
.word{font-size:clamp(2.2rem,11vw,3.8rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere}
.card:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:10px}
button.c{flex:1;font:inherit;font-weight:600;padding:12px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.c:active{transform:translateY(1px)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.no{background:var(--no);border-color:var(--no);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button.t{font:inherit;font-size:.9rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
button.t[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{text-align:center;color:var(--mute);font-size:.85rem;margin:0}
.done{text-align:center;padding:40px 10px;font-size:1.1rem}
.card{aspect-ratio:1/.85}
.face{justify-content:space-between;gap:6px;padding:14px 16px}
.f{color:var(--ink)}
.word{flex:1;display:flex;align-items:center;justify-content:center}
.sen{display:block;font-size:1.05rem;line-height:1.3;font-weight:600}
.sen b{padding:0 .15em;border-bottom:3px solid var(--accent);font-weight:800}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <header><h1>Irregular verbs</h1><span class="count" id="count"></span></header>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <div id="stage">
    <div class="scene">
      <button class="card" id="card" aria-label="Flip card">
        <span class="face f" id="ff"></span>
        <span class="face b" id="fb"></span>
      </button>
    </div>
  </div>
  <div class="row" id="rate">
    <button class="c no" id="miss">Review again</button>
    <button class="c" id="hear">Listen</button>
    <button class="c ok" id="got">Got it</button>
  </div>
  <div class="row">
    <button class="c" id="prev">Previous</button>
    <button class="c" id="next">Next</button>
  </div>
  <div class="tools">
    <button class="t" id="shuf" aria-pressed="false">Shuffle</button>
    <button class="t" id="only" aria-pressed="false">Only cards to review</button>
    <button class="t" id="rev" aria-pressed="false">Show participle first</button>
    <button class="t" id="reset">Reset progress</button>
  </div>
  <p class="hint">Click the card or press Space to flip. Arrow keys move between cards.</p>
</main>
<script>
const RAW=`be|been
bear|born/borne

stand|stood
steal|stolen

stink|stunk

sweep|swept

swim|swum
swing|swung
take|taken
teach|taught

throw|thrown
understand|understood
uphold|upheld
upset|upset
wake|woken
wear|worn
weave|woven
wed|wedded/wed
weep|wept

withdraw|withdrawn
withhold|withheld
withstand|withstood

const ALL=RAW.split("\n").map((l,i)=>{const[a,b]=l.split("|");return{id:i,a,b}});
const SENT={};`be|I have _ here before.
bear|She was _ in May.
beat|They have _ the record.
become|He has _ a doctor.
begin|The show has _ .
bend|I have _ the wire.
bet|She has _ on the team.
bid|He has _ for the lamp.

uphold|The court has _ the law.

wake|I have _ up early.

withdraw|He has _ some cash.
withhold|They have _ the money.
withstand|The bridge has _ storms.
wring|She has _ out the towel.
write|I have _ a letter.`.split("\n").forEach(l=>{const i=l.indexOf("|");SENT[l.slice(0,i)]=l.slice(i+1)});
const scene=w=>`<span class="word">${w}</span>`;
const face=(l,w,a,s,t)=>`<span class="lab">${l}</span>${scene(w,a,s)}<span class="sen">${t}</span>`;
const P={wind:"wynd",wound:"wownd"};
function say(w,part){
  if(!("speechSynthesis" in window))return;
  let t=w==="read"?(part?"red":"reed"):(P[w]||w.replace("/"," or "));
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u);
}
let known=new Set(),order=ALL.map(x=>x.id),pos=0,shuffled=false,only=false,reversed=false;
try{const s=JSON.parse(localStorage.getItem("verbs-known")||"[]");known=new Set(s)}catch(e){}
const $=id=>document.getElementById(id);
const card=$("card");
function save(){try{localStorage.setItem("verbs-known",JSON.stringify([...known]))}catch(e){}}
function build(keepId){
  let ids=ALL.map(x=>x.id);
  if(shuffled){for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}}
  if(only)ids=ids.filter(i=>!known.has(i));
  order=ids;
  pos=keepId!=null&&order.includes(keepId)?order.indexOf(keepId):0;
}
function render(){
  $("bar").style.width=(known.size/ALL.length*100)+"%";
  const empty=order.length===0;
  $("stage").hidden=empty;$("rate").hidden=empty;
  if(empty){
    let d=$("done");
    if(!d){d=document.createElement("div");d.id="done";d.className="done";$("stage").after(d)}
    d.textContent="You have marked every verb as known. Reset progress to start again.";
    $("count").textContent=known.size+" of "+ALL.length+" known";return;
  }
  const d=$("done");if(d)d.remove();
  const v=ALL[order[pos]];
  card.classList.remove("flip");
  const act="",t=SENT[v.a]||"",fill="<b>"+v.b.split("/")[0]+"</b>",sen=x=>t.replace("_",x);
  $("ff").innerHTML=face(reversed?"Past participle":"Simple present",reversed?v.b:v.a,act,"f",sen(reversed?fill:"<b>_____</b>"));
  $("fb").innerHTML=face(reversed?"Simple present":"Past participle",reversed?v.a:v.b,act,"b",sen(fill));
  card.setAttribute("aria-label","Flip card: "+(reversed?v.b:v.a));
  $("count").textContent="Card "+(pos+1)+" of "+order.length+" · "+known.size+" known";
}
function go(d){if(!order.length)return;pos=(pos+d+order.length)%order.length;render()}
function rate(ok){
  if(!order.length)return;
  const id=order[pos];
  if(ok)known.add(id);else known.delete(id);
  save();
  if(only&&ok){order.splice(pos,1);if(pos>=order.length)pos=0;render()}else go(1);
}
card.onclick=()=>card.classList.toggle("flip");
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("got").onclick=()=>rate(true);$("miss").onclick=()=>rate(false);
$("shuf").onclick=e=>{shuffled=!shuffled;e.target.setAttribute("aria-pressed",shuffled);build();render()};
$("only").onclick=e=>{only=!only;e.target.setAttribute("aria-pressed",only);build();render()};
$("rev").onclick=e=>{reversed=!reversed;e.target.setAttribute("aria-pressed",reversed);render()};
$("reset").onclick=()=>{known.clear();save();build();render()};
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "&&document.activeElement!==card&&e.target.tagName!=="BUTTON"){e.preventDefault();card.classList.toggle("flip")}
});
$("hear").onclick=()=>{
  if(!order.length)return;
  const v=ALL[order[pos]],part=reversed?!card.classList.contains("flip"):card.classList.contains("flip");
  say(part?v.b:v.a,part);
};
if(!("speechSynthesis" in window))$("hear").hidden=true;
build();render();
</script>
</body>
</html>
