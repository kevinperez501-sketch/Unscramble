<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Tenses Flashcards</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1e2a38;--sub:#5d6b7a;--accent:#2f6fed;--accent2:#e8efff;--line:#d9d6cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--card:#1e252e;--ink:#eef1f5;--sub:#9aa7b5;--accent:#7aa5ff;--accent2:#22304a;--line:#2f3945}}
:root[data-theme="dark"]{--bg:#14181e;--card:#1e252e;--ink:#eef1f5;--sub:#9aa7b5;--accent:#7aa5ff;--accent2:#22304a;--line:#2f3945}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px;min-height:100vh}
h1{font-size:1.1rem;margin:0 0 4px;letter-spacing:.02em}
.sub{color:var(--sub);font-size:.85rem;margin-bottom:16px}
.scene{width:100%;max-width:460px;height:470px;perspective:1200px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.front{align-items:center;justify-content:center;text-align:center}
.tag{font-size:.75rem;color:var(--accent);background:var(--accent2);padding:3px 10px;border-radius:99px;margin-bottom:14px}
.front .name{font-size:2rem;font-weight:700;line-height:1.2}
.hint{position:absolute;bottom:14px;font-size:.75rem;color:var(--sub)}
.back{transform:rotateY(180deg);overflow:auto;justify-content:center}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin:10px 0 4px}
.formula{font-size:1.15rem;font-weight:700;color:var(--accent);background:var(--accent2);padding:10px 12px;border-radius:10px}
.aux{font-size:.9rem;margin-top:6px}
.use{font-size:.95rem;line-height:1.4}
.ex{margin:0;padding:0;list-style:none}
.ex li{padding:8px 0;border-top:1px solid var(--line);font-size:1rem}
.ex li:first-child{border-top:0}
.nav{display:flex;gap:10px;align-items:center;margin-top:18px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;cursor:pointer}
button:hover{border-color:var(--accent)}
.count{min-width:70px;text-align:center;color:var(--sub);font-size:.9rem}
</style>
</head>
<body>
<h1>English Tenses</h1>
<div class="sub">Tap the card to flip · ← → to move</div>
<div class="scene" id="scene"><div class="card" id="card">
  <div class="face front"><span class="tag" id="num"></span><div class="name" id="name"></div><div class="hint">Tap to see the answer</div></div>
  <div class="face back">
    <div class="lbl">Aux + Verb form</div>
    <div class="formula" id="formula"></div>
    <div class="aux" id="aux"></div>
    <div class="lbl">When we use it</div>
    <div class="use" id="use"></div>
    <div class="lbl">Examples</div>
    <ul class="ex" id="ex"></ul>
  </div>
</div></div>
<div class="nav">
  <button id="prev">← Prev</button><span class="count" id="count"></span><button id="next">Next →</button>
  <button id="shuf">Shuffle</button>
</div>
<script>
var base=[
["Simple Present","V1 (add -s/-es for he/she/it)","Questions/negatives: do / does + base verb",["She works every day.","They play football on Sundays."]],
["Present Continuous","am / is / are + V-ing","Aux: am, is, are",["I am studying right now.","He is cooking dinner."]],
["Present Perfect","have / has + past participle (V3)","Aux: have, has",["I have finished my homework.","She has visited Paris twice."]],
["Present Perfect Continuous","have / has + been + V-ing","Aux: have/has + been",["We have been waiting for an hour.","He has been working since 8 a.m."]],
["Simple Past","V2 (past form)","Questions/negatives: did + base verb",["I watched a movie last night.","She went to school yesterday."]],
["Past Continuous","was / were + V-ing","Aux: was, were",["I was reading when you called.","They were playing at noon."]],
["Past Perfect","had + past participle (V3)","Aux: had",["She had left before I arrived.","They had eaten when we got there."]],
["Past Perfect Continuous","had + been + V-ing","Aux: had + been",["He had been sleeping for hours.","We had been walking for two hours when it rained."]],
["Simple Future","will + base verb","Aux: will",["I will call you tomorrow.","It will rain tonight."]],
["Future Continuous","will + be + V-ing","Aux: will + be",["This time tomorrow, I will be flying.","She will be working at 9 p.m."]],
["Future Perfect","will + have + past participle (V3)","Aux: will + have",["By June, I will have graduated.","They will have finished by noon."]],
["Future Perfect Continuous","will + have + been + V-ing","Aux: will + have + been",["By May, she will have been teaching for 10 years.","Next month, I will have been living here for five years."]]
];
var uses={
"Simple Present":"Habits, routines, and general facts. Also used for scheduled events like timetables.",
"Present Continuous":"Actions happening right now or around the present time. Also used for fixed plans in the near future.",
"Present Perfect":"An action that starts in the past and continues to the present. It can also be repeated over that time.",
"Present Perfect Continuous":"Actions that started in the past and are still going, or just stopped with visible results. It focuses on how long.",
"Simple Past":"Finished actions at a specific time in the past. Also used for past habits and sequences of events.",
"Past Continuous":"An action in progress at a particular moment in the past. Often used when another action interrupted it.",
"Past Perfect":"The earlier of two past actions. It shows what had already happened before another past moment.",
"Past Perfect Continuous":"How long an action had been going on before a point in the past. Often used to explain a past situation or result.",
"Simple Future":"Predictions, promises, and decisions made at the moment of speaking. Also used for future facts.",
"Future Continuous":"An action that will be in progress at a specific time in the future. Also used for polite questions about plans.",
"Future Perfect":"An action that will be completed before a certain time in the future.",
"Future Perfect Continuous":"How long an action will have been going on by a certain future time. It emphasizes duration up to that point."
};
var deck=base.slice(),i=0,card=document.getElementById("card");
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function show(){
  card.classList.remove("flipped");
  var c=deck[i];
  document.getElementById("num").textContent="Tense "+(base.indexOf(c)+1)+" of "+base.length;
  document.getElementById("name").textContent=c[0];
  document.getElementById("formula").textContent=c[1];
  document.getElementById("aux").textContent=c[2];
  document.getElementById("use").textContent=uses[c[0]];
  document.getElementById("ex").innerHTML=c[3].map(function(e){return"<li>"+esc(e)+"</li>"}).join("");
  document.getElementById("count").textContent=(i+1)+" / "+deck.length;
}
function go(d){i=(i+d+deck.length)%deck.length;show()}
document.getElementById("scene").onclick=function(){card.classList.toggle("flipped")};
document.getElementById("prev").onclick=function(){go(-1)};
document.getElementById("next").onclick=function(){go(1)};
document.getElementById("shuf").onclick=function(){
  for(var k=deck.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=deck[k];deck[k]=deck[j];deck[j]=t}
  i=0;show();
};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();card.classList.toggle("flipped")}
});
show();
</script>
</body>
</html>
