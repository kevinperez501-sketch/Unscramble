<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher Kevin</title>
<style>
:root{
  --bg:#ffffff; --ink:#12284d; --muted:#4b5f80;
  --bubble:#12284d; --bubble-ink:#ffffff; --gold:#e0a93a; --cyan:#6cc6dc;
  --label-bg:#ffffff; --label-ink:#12284d; --orbit:rgba(18,40,77,.18);
  --glow:rgba(108,198,220,.35);
  --core:clamp(150px,40vmin,230px);
  --bub:clamp(54px,13vmin,70px);
  --r:clamp(132px,32vmin,190px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow-x:hidden;
}
.hint{
  margin:0 0 clamp(8px,3vmin,24px);color:var(--muted);font-size:1rem;text-align:center;
  padding:0 16px;min-height:1.5em;
}
.stage{
  position:relative;width:calc(var(--r)*2 + var(--bub) + 24px);
  height:calc(var(--r)*2 + var(--bub) + 56px);max-width:100%;
  display:grid;place-items:center;
}
.orbit{
  position:absolute;left:50%;top:50%;width:calc(var(--r)*2);height:calc(var(--r)*2);
  margin:calc(var(--r)*-1) 0 0 calc(var(--r)*-1);border-radius:50%;
  border:2px dashed var(--orbit);opacity:0;transform:scale(.6);
  transition:opacity .4s ease,transform .5s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;
}
.core{
  position:relative;z-index:3;width:var(--core);height:var(--core);padding:0;border:0;
  border-radius:50%;overflow:visible;cursor:pointer;background:transparent;
  box-shadow:none;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2),box-shadow .35s ease;
}
.core img{width:100%;height:100%;display:block;mix-blend-mode:multiply;pointer-events:none}
.core:focus-visible,.item a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.item{
  position:absolute;left:50%;top:50%;z-index:2;width:var(--bub);height:var(--bub);
  margin:calc(var(--bub)/-2) 0 0 calc(var(--bub)/-2);
  transform:translate(0,0) scale(.2);opacity:0;visibility:hidden;
  transition:transform .5s cubic-bezier(.2,.9,.3,1.25),opacity .3s ease,visibility 0s linear .5s;
  transition-delay:0s;
}
.item a{
  display:grid;place-items:center;width:100%;height:100%;border-radius:50%;
  background:var(--bubble);color:var(--bubble-ink);text-decoration:none;
  border:3px solid var(--gold);box-shadow:0 8px 20px rgba(10,23,48,.25);
  transition:transform .2s ease,background .2s ease,color .2s ease,border-color .2s ease;
}
.item a:hover{transform:scale(1.12);background:var(--gold);color:#12284d;border-color:var(--cyan)}
.item svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item span{
  position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--label-bg);color:var(--label-ink);font-weight:700;font-size:.875rem;
  padding:4px 10px;border-radius:999px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(10,23,48,.18);pointer-events:none;
}
.stage.open .orbit{opacity:1;transform:scale(1)}
.stage.open .core{transform:scale(.94)}
.stage.open .item{
  opacity:1;visibility:visible;
  transform:translate(calc(var(--x)*var(--r)),calc(var(--y)*var(--r))) scale(1);
  transition-delay:calc(var(--i)*70ms);
}
@media (hover:hover){
  .stage:hover .orbit{opacity:1;transform:scale(1)}
  .stage:hover .core{transform:scale(.94)}
  .stage:hover .item{
    opacity:1;visibility:visible;
    transform:translate(calc(var(--x)*var(--r)),calc(var(--y)*var(--r))) scale(1);
    transition-delay:calc(var(--i)*70ms);
  }
}
.item:nth-child(3){--x:-.7071;--y:-.7071;--i:0}
.item:nth-child(4){--x:.7071;--y:-.7071;--i:1}
.item:nth-child(5){--x:.7071;--y:.7071;--i:2}
.item:nth-child(6){--x:-.7071;--y:.7071;--i:3}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
